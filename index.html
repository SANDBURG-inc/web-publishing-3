<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <title>ut</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link href="css/main.css" rel="stylesheet" />
  </head>
  <body>
    <div class="side-bar">
      <div>
        <i class="fa-solid fa-house"></i>
        <p>Home</p>
      </div>
      <div>
        <i class="fa-solid fa-headphones"></i>
        <p>Services</p>
      </div>
      <div>
        <i class="fa-solid fa-flag"></i>
        <p>Alerts</p>
      </div>
      <div>
        <i class="fa-solid fa-chart-pie"></i>
        <p>Stats</p>
      </div>
    </div>
    <div class="header">
      <div class="header-left">
        <form class="d-flex d-none d-md-flex" role="search">
          <input
            class="form-control"
            type="search"
            placeholder="Search"
            aria-label="Search"
            style="border-radius: 4px 0 0 4px"
          />
          <button
            class="btn btn-dark"
            type="submit"
            style="border-radius: 0 4px 4px 0"
          >
            <i class="fa-solid fa-magnifying-glass"></i>
          </button>
        </form>
      </div>
      <div class="mobile-menu d-md-none">
        <button class="hamburger-btn" type="button">
          <i class="fa-solid fa-bars"></i>
        </button>
      </div>

      <div class="header-content-wrap d-none d-md-flex">
        <div class="header-btn-wrap">
          <button
            type="button"
            class="btn position-relative"
            style="padding: 0px"
          >
            <i
              class="fa-solid fa-bell"
              style="font-size: 24px; color: #808080"
            ></i>
            <span
              class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
            >
              5
              <span class="visually-hidden">unread messages</span>
            </span>
          </button>
          <button
            type="button"
            class="btn position-relative"
            style="padding: 0px"
          >
            <i
              class="fa-solid fa-envelope"
              style="font-size: 24px; color: #808080"
            ></i>
            <span
              class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
            >
              9
              <span class="visually-hidden">unread messages</span>
            </span>
          </button>
        </div>
        <p style="margin: 0; color: #808080">Minny Park</p>
      </div>
    </div>

    <div class="main-content">
      <div class="dashboard">
        <h1 class="dashboard-title">Dashboard</h1>
        <div class="cards-container">
          <div class="card-a">
            <div class="card-a-content">
              <div class="card-a-info">
                <p class="card-a-title">Earnings (Monthly)</p>
                <h2 class="card-a-number">$400,000</h2>
              </div>
              <div class="card-a-icon">
                <i class="fa-solid fa-calendar"></i>
              </div>
            </div>
          </div>

          <div class="card-a">
            <div class="card-a-content">
              <div class="card-a-info">
                <p class="card-a-title">Earnings (Annual)</p>
                <h2 class="card-a-number">$800,000</h2>
              </div>
              <div class="card-a-icon">
                <i class="fa-solid fa-dollar-sign"></i>
              </div>
            </div>
          </div>

          <div class="card-a">
            <div class="card-a-content">
              <div class="card-a-info">
                <p class="card-a-title">Tasks</p>
                <h2 class="card-a-number">13</h2>
              </div>
              <div class="card-a-icon">
                <i class="fa-solid fa-list-check"></i>
              </div>
            </div>
          </div>

          <div class="card-a">
            <div class="card-a-content">
              <div class="card-a-info">
                <p class="card-a-title">Requests</p>
                <h2 class="card-a-number">26</h2>
              </div>
              <div class="card-a-icon">
                <i class="fa-solid fa-comments"></i>
              </div>
            </div>
          </div>
        </div>
        <div class="card-wrap">
          <div class="card card-b">
            <div class="card-header">Earnings Overview</div>
            <div class="card-body">
              <canvas id="myChart"></canvas>
            </div>
          </div>
          <div class="card card-c">
            <div class="card-header">Tasks</div>
            <ul class="list-group list-group-flush">
              <li class="list-group-item">An item</li>
              <li class="list-group-item">A second item</li>
              <li class="list-group-item">A third item</li>
            </ul>
          </div>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
      var ctx = document.getElementById("myChart").getContext("2d");

      var gradient = ctx.createLinearGradient(0, 0, 0, 400);
      gradient.addColorStop(0, "rgba(73, 76, 180, 0.4)");
      gradient.addColorStop(1, "rgba(73, 76, 180, 0)");

      var myChart = new Chart(ctx, {
        type: "line",
        data: {
          labels: ["Red", "Blue", "Yellow", "Green", "Purple", "Orange"],
          datasets: [
            {
              label: "# of Votes",
              data: [12, 19, 3, 5, 2, 3],
              fill: true,
              backgroundColor: gradient,
              borderColor: "#494CB4",
              borderWidth: 1,
              tension: 0.4,
            },
          ],
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            y: {
              beginAtZero: true,
            },
          },
        },
      });
    </script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
